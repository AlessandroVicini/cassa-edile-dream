<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cassa Edile Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: il tabellone del poster (Uffici giallo in alto, Prestazioni arancio in basso, Premialità azzurro a destra),
   con la carta della Cassa e il round in testa. Tema unico chiaro, scelto: è un tabellone da tavolo. */
:root{
  --sky:#19b8d4; --leaf:#9fd28e; --sun:#f6d86a;
  --board-ink:#4b3f38; --paper:#fffbf2; --white:#ffffff;
  --uff:#f7d46c; --uff-deep:#e9b93a;
  --prest:#fb9150; --prest-deep:#e8702a;
  --prem:#eef4fb; --prem-deep:#b9cde6;
  --blue:#2f63ad; --orange:#e2700f; --green:#4c8a39; --viola:#6a32a2; --viola-soft:#f1e9fa;
  --ink:#2a231f; --muted:#6c5f57; --line:#d9cfc4;
  --bad:#c42a2c; --bad-soft:#fde6e4; --good:#2c7a3a; --good-soft:#e3f3e1; --warn:#a86500; --warn-soft:#fff1d4;
  --f-hand:"Kalam","Comic Sans MS",cursive;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:linear-gradient(115deg,var(--sky) 0%,var(--leaf) 52%,var(--sun) 100%) fixed;
  background-color:var(--leaf);
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px}
.brand{background:var(--paper);border:3px solid var(--board-ink);padding:6px 20px 4px;border-radius:4px;box-shadow:4px 4px 0 var(--board-ink);
  font-family:var(--f-hand);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.55);padding:4px;border-radius:999px;border:2px solid var(--board-ink)}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--board-ink);color:var(--paper)}
.sync{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.7);border:1.5px solid var(--board-ink);border-radius:999px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}
.sync.on i{background:var(--good)} .sync.ro i{background:var(--warn)}

/* shared bits */
.panel{background:var(--paper);border:3px solid var(--board-ink);border-radius:22px;box-shadow:6px 6px 0 rgba(75,63,56,.85)}
.tag{display:inline-block;background:var(--white);border:2px solid var(--board-ink);border-radius:12px;padding:2px 16px 0;font-family:var(--f-hand);font-weight:700;font-size:23px;line-height:1.5;position:relative}
.tag::before,.tag::after{content:"";position:absolute;top:-12px;width:3px;height:16px;background:var(--board-ink);border-radius:2px}
.tag::before{left:16px}.tag::after{right:16px}
.btn{border:2px solid var(--board-ink);background:var(--white);border-radius:12px;padding:8px 16px;font-weight:600;box-shadow:3px 3px 0 var(--board-ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--board-ink)}
.btn.primary{background:var(--board-ink);color:var(--paper)}
.btn.viola{background:var(--viola);color:#fff;border-color:#3d1a63;box-shadow:3px 3px 0 #3d1a63}
.btn.small{padding:4px 10px;font-size:13px;box-shadow:2px 2px 0 var(--board-ink)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.neutral{background:#eee6dc;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--white);border-radius:8px;padding:6px 8px;width:100%;min-width:0;font-size:14px;color:var(--ink);font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(47,99,173,.18)}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}

/* chooser */
.chooser{padding:24px}
.chooser h2{font-family:var(--f-hand);font-size:30px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.tablecard{text-align:left;border:3px solid var(--board-ink);border-radius:16px;background:var(--white);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--board-ink)}
.tablecard:hover{background:#fff6dc}
.tablecard b{font-family:var(--f-hand);font-size:24px;line-height:1.1}
.how{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px;max-width:75ch}
.how summary{font-weight:700;cursor:pointer}
.how ol{padding-left:20px;margin:10px 0 0;display:grid;gap:6px}

/* game head */
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px;margin-bottom:22px}
.cassacard{background:#fffdf6;border:3px solid #6b3f12;outline:4px solid #f4c66a;outline-offset:-10px;border-radius:14px;padding:22px 24px;box-shadow:5px 5px 0 rgba(75,63,56,.85)}
.cassacard .kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cassacard h2{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:2px 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.ages{display:flex;gap:6px;margin:8px 0 2px;height:26px;border-radius:6px;overflow:hidden}
.ages span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.contrib{margin-top:12px;padding-top:10px;border-top:1.5px dashed var(--line);font-size:13.5px;display:grid;gap:3px}
.contrib div{display:flex;justify-content:space-between;gap:8px}
.roundbox{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.roundbox .rt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.roundbox .rt h3{font-family:var(--f-hand);font-size:26px;line-height:1.1}
.roundnum{background:var(--board-ink);color:var(--paper);border-radius:999px;padding:2px 12px;font-weight:700;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm p{margin:0;flex:1 1 220px;font-size:13.5px}
.deck{display:flex;gap:12px;flex-wrap:wrap}
.vcard{width:150px;min-height:180px;border-radius:14px;border:4px solid var(--viola);background:var(--white);padding:12px;font-size:13px;position:relative}
.vcard.back{background:repeating-linear-gradient(45deg,var(--viola) 0 10px,#7d45b8 10px 20px);border-color:#3d1a63;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-hand);font-size:22px;text-align:center;transition:transform .2s}
.vcard.back:hover{transform:translateY(-4px) rotate(-1.5deg)}
.vcard h4{margin:0 0 6px;color:var(--viola);font-size:13px}
.vcard ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.vcard .aum{margin-top:10px;border-top:1.5px solid var(--viola);padding-top:6px}
.vcard .aum b{display:block;color:var(--viola);font-size:20px}
.r2grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"uff prem" "prest prem";gap:22px;align-items:start}
.area{border:4px solid var(--board-ink);border-radius:48px 48px 48px 48px;padding:26px 24px 24px;box-shadow:7px 7px 0 var(--board-ink);min-width:0}
.area.uff{grid-area:uff;background:var(--uff);border-radius:60px 24px 60px 24px}
.area.prest{grid-area:prest;background:var(--prest);border-radius:60px 24px 90px 24px}
.area.prem{grid-area:prem;background:var(--prem);border-radius:12px}
.areahead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pct{font-family:var(--f-hand);font-weight:700;font-size:38px;line-height:1}
.meter{background:rgba(255,255,255,.82);border:2px solid var(--board-ink);border-radius:14px;padding:10px 12px;margin-bottom:16px;display:grid;gap:7px}
.meter .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px}
.meter .row b{font-size:15px}
.bar{height:12px;border-radius:999px;background:#e8e0d6;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .25s}
.bar.over i{background:var(--bad)}
.bar .res{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--viola) 0 4px,transparent 4px 8px);opacity:.55}

.offices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.office{background:var(--white);border:3px solid var(--blue);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.office.on{background:#e7effa}
.office .nm{font-weight:700;color:#1d3f74;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;min-height:2.4em}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:2px solid var(--blue);background:var(--white);font-weight:700;color:var(--blue);flex:none}
.step input{text-align:center;padding:4px 2px;width:100%}
.step .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.foot{margin-top:12px;font-size:13.5px;background:rgba(255,255,255,.6);border-radius:10px;padding:8px 12px}

.fondi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcard,.pcard{background:var(--white);border:4px solid var(--orange);border-radius:12px;padding:10px 12px 12px;display:grid;gap:8px;position:relative;min-width:0}
.fcard .hd,.pcard .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fcard .hd span{color:var(--orange);font-weight:700;font-size:12px;letter-spacing:.04em}
.slotno{font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1;color:var(--board-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cost{display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:1.5px dashed var(--line);padding-top:6px}
.cost b{font-size:15px}
.pcard{border-color:var(--green)}
.pcard .hd span{color:var(--green);font-weight:700;font-size:12px;letter-spacing:.04em}
.premi{display:grid;gap:12px}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.banner{margin-top:22px;background:#e6f0fb;border:3px solid #2f2a6b;border-radius:6px;padding:14px 18px;box-shadow:5px 5px 0 #2f2a6b;position:relative}
.banner::before,.banner::after{content:"";position:absolute;width:26px;height:14px;background:#f4ad3d;border:2px solid #2f2a6b;transform:rotate(-40deg)}
.banner::before{top:-9px;left:-10px}.banner::after{bottom:-9px;right:-10px}
.banner input{font-family:var(--f-hand);font-size:22px;border:0;background:transparent;border-bottom:2px dashed #2f2a6b;border-radius:0;padding:4px 2px}
.warnlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.warnlist li{font-size:13px;display:flex;gap:8px;align-items:flex-start}

/* sede */
.sede{background:#fbf7ef;border:2.5px dashed var(--board-ink);border-radius:14px;padding:10px 14px 12px;margin-bottom:14px}
.sede .sh{display:flex;justify-content:space-between;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.sede h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.sede .tot{font-size:17px;font-weight:700}
.sede ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px;font-size:13px}
.sede li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0;min-width:0}
.sede li span:first-child{min-width:0}
.sede .codein{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sede .codein input{flex:1 1 200px}
.sedegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:12px}
.sedecol{border:2px solid var(--board-ink);border-radius:14px;padding:12px;background:var(--white);display:grid;gap:6px;min-width:0;align-content:start}
.sedecol h3{font-size:15px}
.sederow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center;font-size:12.5px}
.sederow input{text-align:right;padding:4px 6px}
.sederow.extra{grid-template-columns:minmax(0,1fr) 112px}
.sederow input[type=text]{text-align:left}
.sedetot{border-top:2px solid var(--board-ink);padding-top:6px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}

.joinbox{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--white);border:2px solid var(--board-ink);border-radius:14px;padding:10px 14px;margin-bottom:18px}
.joinbox label.f{flex:1 1 100%}
.codein{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 260px}
.codein input{flex:1 1 160px;text-transform:uppercase;letter-spacing:.08em}
#share-link{text-transform:none;letter-spacing:0}
.bigcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(40px,9vw,72px);font-weight:700;letter-spacing:.18em;line-height:1.1;margin:6px 0}
[hidden]{display:none!important}
img{max-width:100%}

/* regia */
.regia{display:grid;gap:22px}
.regia .panel{padding:18px 20px}
.regia h2{font-family:var(--f-hand);font-size:28px}
.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.settings label.f{width:200px}
.scroll{overflow-x:auto;margin-top:12px}
table.ov{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
table.ov th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--board-ink)}
table.ov td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.mini{display:grid;gap:3px;min-width:140px}
.mini .bar{height:8px}
.mini small{font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.terr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:12px}
.terr .box{border:2px solid var(--board-ink);border-radius:14px;padding:12px 14px;background:var(--white)}
.terr .box h3{font-size:15px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px}
.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:12px}
.details details{border:2px solid var(--board-ink);border-radius:14px;background:var(--white);padding:10px 14px}
.details summary{cursor:pointer;font-weight:700}
.details ul{margin:6px 0 10px;padding-left:18px;font-size:13px}
.details h4{margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.import{display:grid;gap:8px;margin-top:6px}
.import textarea{min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.empty{padding:18px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(42,35,31,.55);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal .panel{max-width:560px;width:100%;padding:20px;display:grid;gap:12px}
.modal textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--board-ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60}

@media (max-width:900px){
  .head{grid-template-columns:1fr}
  .board{grid-template-columns:1fr;grid-template-areas:"uff" "prest" "prem"}
}
@media (max-width:520px){
  .brand{font-size:20px}
  .area{padding:20px 14px 16px;border-radius:28px !important}
  .two{grid-template-columns:1fr}
  .pct{font-size:30px}
  .sync{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Cassa Edile Dream</div>
    <nav class="tabs" role="tablist">
      <button id="tab-tavolo" role="tab" aria-selected="true">Tavolo di gioco</button>
      <button id="tab-regia" role="tab" aria-selected="false">Regia</button>
    </nav>
    <div class="sync" id="sync"><i></i><span>Solo su questo dispositivo</span></div>
  </header>
  <main id="view-tavolo"></main>
  <main id="view-regia" hidden></main>
</div>
<div id="modal-root"></div>

<script>
/* ---------- dati del gioco (dal materiale cartaceo) ---------- */
const CASSE={
  allegria:{nome:"Provincia Allegria",tipo:"Cassa Edile provinciale",lav:14793,fasce:[25,45,30],imprese:3095,massa:243998149,col:"#1aa0bd"},
  soddisfazione:{nome:"Provincia Soddisfazione",tipo:"Cassa Edile provinciale",lav:8110,fasce:[21,47,32],imprese:1454,massa:120089357,col:"#e2700f"},
  appagamento:{nome:"Regione Appagamento",tipo:"Cassa Edile regionale",lav:6785,fasce:[20,40,40],imprese:1607,massa:105404409,col:"#6b3f12"}
};
const GRUPPI={1:"allegria",2:"allegria",3:"soddisfazione",4:"soddisfazione",5:"appagamento",6:"appagamento"};
const AREE=[
  {k:"uff",nome:"Uffici / Servizi",q:.75,col:"#e9b93a"},
  {k:"prest",nome:"Prestazioni ai lavoratori",q:.45,col:"#e8702a"},
  {k:"prem",nome:"Premialità imprese",q:1.05,col:"#7f9fc8"}
];
const UFFICI=["Direzione","Vicedirezione","Segreteria","Amministrazione","Recupero Crediti","Ufficio DURC","Ufficio BNI","Ufficio MUT","Ufficio CED","Ufficio Legale","Asseverazione","Corsi","Ufficio Legalità","Ufficio Progetti e Bandi","Ufficio Appalti","Ufficio Visite"];
const VIOLA=[{prest:5,prem:10,uff:18,aum:3},{prest:3,prem:8,uff:11,aum:2},{prest:1,prem:2,uff:17,aum:4}];
const TARGET={tutti:"Tutti i lavoratori",u35:"Under 35",m35:"Over 35 – under 50",o50:"Over 50 – under 65"};
const MAX_PREMI=10;
const SEDE_VOCI=[
  {k:"affitto",nome:"Affitto o ammortamento della sede"},
  {k:"utenze",nome:"Utenze: energia, gas, acqua"},
  {k:"pulizie",nome:"Pulizie e vigilanza"},

function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}

let cfg=Object.assign({costo:45000,sede:{}},lsGet("cfg")||{});
if(!cfg.sede||typeof cfg.sede!=="object")cfg.sede={};
function sedeOf(cassa){const s=cfg.sede[cassa];return s&&typeof s==="object"?s:{}}
function sedeExtra(cassa){const x=sedeOf(cassa).extra;return Array.isArray(x)?x:[]}
function sedeTot(cassa){
  const s=sedeOf(cassa);
  return SEDE_VOCI.reduce((t,v)=>t+(+s[v.k]||0),0)+sedeExtra(cassa).reduce((t,x)=>t+(+x.importo||0),0);
}
let S=null;            // stato del tavolo aperto su questo dispositivo

function nuovoStato(g){
  return {g, cassa:GRUPPI[g], nome:"", uffici:{},
    fondi:Array.from({length:5},()=>({nome:"",target:"tutti",importo:"",benef:""})),
    premi:Array.from({length:3},()=>({nome:"",criterio:"",importo:"",imprese:""})),
    round:1, viola:null, r1:null, updated:Date.now()};
}
function calc(s,costo=cfg.costo){
  const c=CASSE[s.cassa];
  const v=(s.round===2&&s.viola!=null)?VIOLA[s.viola]:null;
  const massa=c.massa*(1+(v?v.aum/100:0));
  const b={};
  AREE.forEach(a=>{const l=massa*a.q/100;const r=v?l*v[a.k]/100:0;b[a.k]={lordo:l,riserva:r,netto:l-r}});
  const pers=Object.values(s.uffici||{}).reduce((x,y)=>x+(+y||0),0);
  const sede=sedeTot(s.cassa), costoPers=pers*costo;
  const spesa={
    uff:costoPers+sede,
    prest:(s.fondi||[]).reduce((t,f)=>t+(+f.importo||0)*(+f.benef||0),0),
    prem:(s.premi||[]).reduce((t,p)=>t+(+p.importo||0)*(+p.imprese||0),0)
  };
  return {c,v,massa,b,spesa,pers,sede,costoPers,contributo:massa*2.25/100};
}
function platea(c,t){
  if(t==="u35")return Math.round(c.lav*c.fasce[0]/100);
  if(t==="m35")return Math.round(c.lav*c.fasce[1]/100);
  if(t==="o50")return Math.round(c.lav*c.fasce[2]/100);
  return c.lav;
}
function stato(spesa,netto){
  if(spesa>netto+0.5)return{cls:"bad",txt:"Sforato"};
  if(spesa===0)return{cls:"neutral",txt:"Da impostare"};
  if(spesa<netto*0.85)return{cls:"warn",txt:"Risorse inutilizzate"};
  return{cls:"ok",txt:"In equilibrio"};
}

function checks(k){
  const items=[];
  AREE.forEach(a=>{
    const st=stato(k.spesa[a.k],k.b[a.k].netto);
    if(st.cls==="bad")items.push(["bad",`${a.nome}: sforate di ${E(k.spesa[a.k]-k.b[a.k].netto)}`]);
    else if(st.cls==="warn")items.push(["warn",`${a.nome}: restano ${E(k.b[a.k].netto-k.spesa[a.k])} non assegnati`]);
  });
  if(k.sede>k.b.uff.netto)items.push(["bad",`Le sole spese della sede (${E(k.sede)}) superano la quota per la gestione`]);
  if(!S.uffici["Direzione"])items.push(["warn","Nessuno in Direzione: chi guida la Cassa?"]);
  if(!items.length&&AREE.every(a=>k.spesa[a.k]>0))items.push(["ok","Tutte le quote sono in equilibrio"]);
  if(!items.length)return "";
  return `<ul class="warnlist">${items.map(([c,t])=>`<li><span class="chip ${c}">${c==="ok"?"OK":c==="bad"?"!":"·"}</span><span>${t}</span></li>`).join("")}</ul>`;
}

/* ---------- codice per la regia ---------- */
function b64u(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(str){str=str.replace(/-/g,"+").replace(/_/g,"/");while(str.length%4)str+="=";const bin=atob(str);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function encode(obj){
  const txt=JSON.stringify(obj);
  try{const st=new Blob([txt]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "CED1."+b64u(new Uint8Array(await new Response(st).arrayBuffer()))}
  catch(e){return "CED0."+b64u(new TextEncoder().encode(txt))}
}
async function decode(code){
  code=code.replace(/\s+/g,""); const dot=code.indexOf(".");
  const p=code.slice(0,dot), bytes=unb64u(code.slice(dot+1));
  if(p==="CED1"){const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(st).text())}
  if(p==="CED0")return JSON.parse(new TextDecoder().decode(bytes));
  throw new Error("formato");
}
async function mostraCodice(){
  const code=await encode(S);
  const live=db&&canWrite;
  showCode("Invia alla regia",live?"Questo tavolo è già collegato: la regia vede i vostri dati in tempo reale. Il codice serve solo come copia di sicurezza.":"Copiate questo codice e mandatelo al formatore (chat, mail, WhatsApp). In Regia lo incolla e vede la vostra Cassa.",code);
}

  };

  $("#costo").onchange=e=>{
    cfg.costo=Math.max(0,+e.target.value||0); saveCfg();
    Object.keys(CASSE).forEach(c=>{const el=$("#sp-"+c);if(el)el.textContent=sedePct(c)});
    toast("Costo per dipendente aggiornato");
  };
  $("#imp-go").onclick=async()=>{
    const txt=$("#imp").value.trim(); const msg=$("#imp-msg");
    if(!txt){msg.textContent="Incollate prima un codice.";return}
    try{
      const s=await decode(txt);
      if(!s||!s.g||!GRUPPI[s.g])throw new Error();
      const imp=lsGet(pk("imports"))||{}; imp["g"+s.g]=s; lsSet(pk("imports"),imp);
      if(db&&canWrite){try{await db.doc("gruppi/g"+s.g).set(s)}catch(_){}}
      renderRegia(); toast(`Tavolo ${s.g} aggiunto`);
    }catch(e){msg.textContent="Codice non leggibile: controllate di averlo copiato per intero."}
  };
  $("#reset").onclick=()=>{
    $("#reset-zone").innerHTML=`<div class="confirm"><p>Cancello i dati di tutti i tavoli di questa partita?</p><button class="btn small primary" id="reset-yes">Sì, azzera</button><button class="btn small" id="reset-no">Annulla</button></div>`;
    $("#reset-no").onclick=renderRegia;
    $("#reset-yes").onclick=async()=>{
      for(let g=1;g<=6;g++)lsDel(pk("g")+g);
      lsDel(pk("imports")); lsDel(pk("current"));
      if(db&&canWrite){for(let g=1;g<=6;g++){try{await db.doc("gruppi/g"+g).delete()}catch(_){}}}
      remote={}; S=null; renderTavolo(); renderRegia(); toast("Tavoli azzerati");
    };
  };
}

/* ---------- tabs ---------- */
function showTab(t){
  $("#tab-tavolo").setAttribute("aria-selected",t==="tavolo");
  $("#tab-regia").setAttribute("aria-selected",t==="regia");
  $("#view-tavolo").hidden=t!=="tavolo";
  $("#view-regia").hidden=t!=="regia";
  if(t==="regia")renderRegia();
  if(location.hash!=="#"+t)history.replaceState(null,"","#"+t);
}
$("#tab-tavolo").onclick=()=>showTab("tavolo");
$("#tab-regia").onclick=()=>showTab("regia");

/* ---------- collegamento Firebase ---------- */
var fs=null, unsubs=[], partita="";
const ALFA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function nuovoCodice(){const a=new Uint32Array(6);crypto.getRandomValues(a);return Array.from(a,n=>ALFA[n%ALFA.length]).join("")}
function pulisciCodice(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8)}
function pk(k){return partita?`p:${partita}:${k}`:k}
function initFirebase(){
  const c=window.FIREBASE_CONFIG;
  if(!c||!c.apiKey||!c.projectId||!window.firebase)return;
  try{firebase.initializeApp(c);fs=firebase.firestore()}catch(e){console.error("Firebase",e);fs=null}
}
function connectPartita(code){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; remote={}; db=null; canWrite=false;
  partita=fs?pulisciCodice(code):"";
  cfg.updated=0; // i dati della partita sul server hanno la precedenza
  try{if(partita)localStorage.setItem(LS+"partita",partita);else localStorage.removeItem(LS+"partita")}catch(e){}
  try{const u=new URL(location.href);if(partita)u.searchParams.set("p",partita);else u.searchParams.delete("p");history.replaceState(null,"",u.pathname+u.search+u.hash)}catch(e){}
  const cur=lsGet(pk("current"));
  S=(cur&&GRUPPI[cur])?(lsGet(pk("g")+cur)||nuovoStato(cur)):null;
  if(fs&&partita){
    const base=`partite/${partita}/`;
    db={doc:p=>fs.doc(base+p),collection:p=>fs.collection(base+p)};
    canWrite=true;
    unsubs.push(db.doc("config/partita").onSnapshot(sn=>{
      if(!sn.exists||sn.metadata.hasPendingWrites)return;
      const d=sn.data()||{};
      if(cfg.updated&&(d.updated||0)<=cfg.updated)return; // la nostra versione è più recente
      cfg.updated=d.updated||0;
      applyCfg({t:"cfg",costo:d.costo,sede:JSON.parse(JSON.stringify(d.sede||{}))});
    },e=>console.error(e)));
    unsubs.push(db.collection("gruppi").onSnapshot(qs=>{
      remote={}; qs.docs.forEach(d=>{remote[d.id]=d.data()}); renderRegia();
    },e=>{console.error(e);canWrite=false;setSync();toast("Collegamento non riuscito: controllate config.js e le regole di Firestore")}));
  }
  setSync(); renderTavolo(); renderRegia();
  if(S)pushRemote();
}

/* ---------- avvio ---------- */
(function start(){
  initFirebase();
  let p=new URLSearchParams(location.search).get("p");
  if(!p){try{p=localStorage.getItem(LS+"partita")}catch(e){}}
  showTab(location.hash==="#regia"?"regia":"tavolo");
  connectPartita(p||"");
})();
</script>
